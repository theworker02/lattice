<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870" role="img" aria-labelledby="t d"><title id="t">Signal Cube mirror scales and internal hardware core</title><desc id="d">Proposed section identifying a light sensor and PV element beneath separate transmitting mirror scales. Their cables enter a central hardware chassis containing a controller, memory, power protection, PV conditioner and wired interface. The visible dark middle band carries optical apertures and an indicator, not the whole internal volume.</desc><defs><linearGradient id="m"><stop stop-color="#eff8ff"/><stop offset=".4" stop-color="#6e879c"/><stop offset=".7" stop-color="#e9f5ff"/><stop offset="1" stop-color="#a7becf"/></linearGradient></defs><rect width="1400" height="870" fill="#14202b"/><g font-family="Arial,sans-serif"><text x="40" y="46" font-size="25" fill="#e9f3fa">SIGNAL CUBE / SURFACE-TO-CORE ASSEMBLY</text><text x="40" y="76" font-size="13" fill="#a1bacd">SC-A0 concept section · not to scale · proportions and hardware placement require reviewed CAD</text>
<g fill="#9ee6d0" font-size="14"><text x="160" y="127">INCIDENT LIGHT</text><text x="745" y="127">INCIDENT LIGHT</text></g><g stroke="#93e0cf" fill="none" stroke-width="2" stroke-dasharray="6 5"><path d="M208 140V249M238 140V249M790 140V249M820 140V249"/></g>
<g fill="url(#m)" stroke="#e0edf7" stroke-width="2"><path d="M80 168Q124 151 172 165L211 190 204 200 80 182Z"/><path d="M160 184Q215 168 275 181L331 208 325 220 160 196Z"/><path d="M285 165Q338 152 383 165L425 191 418 202 285 179Z"/><path d="M656 165Q704 151 750 166L790 192 783 202 656 179Z"/><path d="M741 184Q790 167 848 181L903 208 896 220 741 196Z"/><path d="M865 165Q914 151 960 167L1000 191 992 202 865 179Z"/></g>
<g stroke="#6d97a8" fill="#172f3b"><rect x="173" y="235" width="140" height="53" rx="4"/><rect x="754" y="235" width="140" height="53" rx="4"/></g><rect x="216" y="252" width="54" height="22" fill="#93caba"/><rect x="767" y="248" width="114" height="27" fill="#394b76" stroke="#9daacb"/><g font-size="13" fill="#d6e9f4"><text x="80" y="319">S-L: light detector + black optical well</text><text x="656" y="319">S-P: PV coupon + insulated thermal backing</text><text x="80" y="339" font-size="11" fill="#9fbacc">Transmission through selected scale is REQUIRED.</text><text x="656" y="339" font-size="11" fill="#9fbacc">Dedicated collection input; not a generic sensor wire.</text></g>
<rect x="93" y="385" width="919" height="359" rx="18" fill="#22323f" stroke="#92abba" stroke-width="3"/><rect x="111" y="403" width="883" height="323" rx="10" fill="#111b24" stroke="#4d697e"/><text x="131" y="432" font-size="17" fill="#e0edf7">CENTRAL INTERNAL CHASSIS / PRIMARY HARDWARE LIVES HERE</text>
<g fill="none" stroke-width="3"><path d="M243 288V361H190V459" stroke="#8ed3bd"/><path d="M824 288V360H970V636H689" stroke="#e8c18b"/></g><g font-size="12" fill="#a3bdcc"><text x="300" y="372">Strain-relieved surface flex tails into labeled core connectors</text></g>
<rect x="132" y="457" width="555" height="131" rx="5" fill="#234139" stroke="#7abca7"/><text x="152" y="481" font-size="14" fill="#cef1e3">MAIN CONTROLLER PCB</text><g fill="#152b28" stroke="#619b8a"><rect x="152" y="497" width="127" height="62"/><rect x="294" y="497" width="117" height="62"/><rect x="426" y="497" width="239" height="62"/></g><g font-size="12" fill="#d3e9e3"><text x="168" y="523">MCU + watchdog</text><text x="168" y="544">local processing</text><text x="310" y="523">Memory</text><text x="310" y="544">configuration</text><text x="442" y="523">Sensor interfaces / core connectors</text><text x="442" y="544">temperature + identity + diagnostics</text></g>
<rect x="132" y="610" width="555" height="96" rx="5" fill="#443827" stroke="#c3a176"/><text x="152" y="637" font-size="14" fill="#f4dbb9">POWER / INTERFACE PCB</text><text x="152" y="661" font-size="12" fill="#e6ccb0">Input protection · regulated rails · current / voltage measurement</text><text x="152" y="683" font-size="12" fill="#e6ccb0">Dedicated PV conditioning · wired host interface · thermal sensing</text>
<rect x="714" y="457" width="257" height="131" rx="5" fill="#273347" stroke="#96acd1"/><text x="733" y="483" fill="#dce7fb" font-size="14">BAND PCB + OPTICAL BAFFLES</text><text x="733" y="508" fill="#bbcae0" font-size="12">Recessed receiver / emitter</text><text x="733" y="531" fill="#bbcae0" font-size="12">Short status-light guide</text><text x="733" y="554" fill="#bbcae0" font-size="12">Separate paths to reduce cross-talk</text>
<path d="M689 522H714" stroke="#9cbed3" stroke-width="3"/><path d="M410 588V610" stroke="#b9ccdf" stroke-width="3"/>
<rect x="1003" y="469" width="29" height="109" fill="#080f16" stroke="#bacddd"/><circle cx="1018" cy="502" r="7" fill="#2f4658"/><rect x="1013" y="530" width="10" height="26" rx="4" fill="#7ce4d3"/><path d="M1032 519H1070V455H1090" fill="none" stroke="#c5d5e0"/><g fill="#e6edf5" font-size="15"><text x="1090" y="433">VISIBLE DARK BAND</text></g><g font-size="12" fill="#b6c9d8"><text x="1090" y="479">The outside window into</text><text x="1090" y="499">the central assembly.</text><text x="1090" y="532">The core extends behind it</text><text x="1090" y="552">into the cube's interior.</text><text x="1090" y="585">Bulk hardware is not forced</text><text x="1090" y="605">into the strip's thin height.</text></g>
<path d="M370 706V765" stroke="#a8bdd0" stroke-width="3"/><rect x="317" y="752" width="106" height="22" rx="3" fill="#24384b" stroke="#abc3d4"/><text x="449" y="770" fill="#c8dce9" font-size="13">Recessed underside service / power / wired-host interface</text><text x="40" y="824" fill="#a8c0d2" font-size="12">Also proposed: insulated S-T temperature probes beneath selected scales. Reflective-only scales complete the shell.</text><text x="40" y="848" fill="#a8c0d2" font-size="12">No battery assumed. No selected coating, PCB layout, connector rating, production tolerances or validated hardware implied.</text></g></svg>
