<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Signal Cube light environment and sensor roles</title>
  <desc id="desc">A diagram showing a mirror-scale Signal Cube in a room. Direct light, room reflections, status illumination and heat are separated. Selected light and solar scales connect to a central core.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#d8b780"/></marker><marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#8ed8d0"/></marker><marker id="h" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#df8b78"/></marker></defs>
  <rect width="1400" height="760" fill="#0f1922"/>
  <g font-family="Arial, sans-serif"><text x="72" y="76" fill="#e9f3f5" font-size="32" font-weight="600">LIGHT ENVIRONMENT / WHAT THE CUBE SEES</text><text x="72" y="112" fill="#aebfc9" font-size="17">The core should distinguish useful incoming light from room reflections, internal status light and surface heat.</text>
  <circle cx="178" cy="219" r="50" fill="#d8b780"/><g stroke="#d8b780" stroke-width="4"><path d="M178 143V120"/><path d="M178 318V295"/><path d="M102 219H80"/><path d="M254 219H276"/><path d="m123 164-17-17"/><path d="m233 274 17 17"/><path d="m233 164 17-17"/><path d="m123 274-17 17"/></g><text x="132" y="354" fill="#d8b780" font-size="17" font-weight="600">CONTROLLED LIGHT SOURCE</text>
  <path d="M244 237C360 250 438 280 590 320" fill="none" stroke="#d8b780" stroke-width="6" marker-end="url(#a)"/><text x="358" y="246" fill="#e8c98c" font-size="16">direct light / known angle</text>
  <path d="M296 385C400 460 476 486 600 455" fill="none" stroke="#8faab8" stroke-width="4" stroke-dasharray="11 9" marker-end="url(#t)"/><text x="330" y="438" fill="#b8cad4" font-size="16">room reflection / possible glare</text>
  <g transform="translate(570 220)"><path d="M0 95 170 0 340 102 170 232Z" fill="#1a2934" stroke="#79a0b0" stroke-width="3"/><path d="M0 95 170 232v178L0 270Z" fill="#14212a" stroke="#597a89" stroke-width="3"/><path d="M170 232 340 102v166L170 410Z" fill="#101b23" stroke="#597a89" stroke-width="3"/>
  <g fill="#a6c1cd" stroke="#dcecf0" stroke-width="2"><path d="M48 102 88 76l40 24-40 28z"/><path d="M105 135l40-26 40 24-40 28z"/><path d="M165 168l40-26 40 24-40 28z"/><path d="M228 136l40-26 40 24-40 28z"/><path d="M60 158l40-26 40 24-40 28z"/></g>
  <path d="M112 94 152 68l40 24-40 28z" fill="#183e49" stroke="#8ed8d0" stroke-width="3"/><text x="115" y="56" fill="#9de4d8" font-size="14">S-L</text>
  <path d="M214 78 254 52l40 24-40 28z" fill="#245473" stroke="#8ed8d0" stroke-width="3"/><text x="247" y="42" fill="#9de4d8" font-size="14">S-P</text>
  <rect x="72" y="233" width="196" height="28" rx="6" fill="#111b24" stroke="#5f8d9b"/><circle cx="103" cy="247" r="5" fill="#a7dfd2"/><text x="123" y="253" fill="#d5e8ed" font-size="14">recessed sensing band</text>
  <path d="M78 286h188v70H78z" fill="#0f1820" stroke="#526f7b"/><text x="104" y="320" fill="#a7dfd2" font-size="16" font-weight="600">CENTRAL CORE</text><text x="104" y="345" fill="#b3c6cf" font-size="13">controller · power · interfaces</text></g>
  <path d="M780 322C895 260 987 234 1080 220" fill="none" stroke="#8ed8d0" stroke-width="5" marker-end="url(#t)"/><text x="894" y="247" fill="#9de4d8" font-size="16">S-L reports a calibrated reading</text>
  <path d="M820 285C920 350 1015 388 1080 410" fill="none" stroke="#8ed8d0" stroke-width="5" marker-end="url(#t)"/><text x="910" y="369" fill="#9de4d8" font-size="16">S-P goes to separate PV conditioning</text>
  <path d="M775 461C855 548 952 582 1078 573" fill="none" stroke="#df8b78" stroke-width="5" marker-end="url(#h)"/><text x="843" y="551" fill="#efb4ad" font-size="16">heat must be measured, not guessed</text>
  <g transform="translate(1080 164)"><rect width="252" height="103" rx="9" fill="#162832" stroke="#43707b"/><text x="20" y="31" fill="#a7dfd2" font-size="14" letter-spacing="1">MEASURE</text><text x="20" y="61" fill="#eaf4f5" font-size="17" font-weight="600">Intensity + direction</text><text x="20" y="85" fill="#b6c9d1" font-size="14">only after calibration</text></g>
  <g transform="translate(1080 354)"><rect width="252" height="103" rx="9" fill="#162832" stroke="#43707b"/><text x="20" y="31" fill="#a7dfd2" font-size="14" letter-spacing="1">COLLECT</text><text x="20" y="61" fill="#eaf4f5" font-size="17" font-weight="600">Voltage + current + temp</text><text x="20" y="85" fill="#b6c9d1" font-size="14">PV is not a light meter</text></g>
  <g transform="translate(1080 518)"><rect width="252" height="103" rx="9" fill="#2a1a1a" stroke="#995d5d"/><text x="20" y="31" fill="#efb4ad" font-size="14" letter-spacing="1">PROTECT</text><text x="20" y="61" fill="#f1e0dd" font-size="17" font-weight="600">Separate heat + cross-talk</text><text x="20" y="85" fill="#d9b8b2" font-size="14">status LEDs need baffles</text></g>
  <text x="72" y="696" fill="#a6bdc8" font-size="15">Suggested M1 setup: controlled source, reference meter, fixed angles, logged optical stack, measured temperatures and an explicit dark baseline.</text>
  <text x="72" y="726" fill="#dfaba2" font-size="14">CONCEPT DIAGRAM — it defines what to test, not a performance result.</text></g>
</svg>
